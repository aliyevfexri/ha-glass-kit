# kit_reminder_row: one reminder from a list sensor as a row (text, next time · repeat · speaker, trash icon).
# Tap asks "Delete …?" and then runs variables.delete_action with data {id: <the reminder's id>}.
# entity = a sensor whose attribute `items` is a list of {id, text, next (ISO date-time), repeat, speaker},
# soonest first (the author's: sensor.next_reminder from a template package, see docs/components.md).
# Use up to N rows with index 0..N-1 under the form; rows without a reminder hide themselves, except
# row 0, which says `empty_text` when the list is empty.
# variables:
#   index:         which reminder (0 = soonest)                         (required)
#   delete_action: action run on confirmed tap, gets data {id}          (default script.reminder_delete)
#   empty_text:    text of row 0 when there is nothing                  (default "No reminders yet.")
kit_reminder_row:
  show_icon: false
  show_name: false
  show_state: false
  variables:
    index: 0
    delete_action: script.reminder_delete
    empty_text: No reminders yet.
  triggers_update: all
  tap_action:
    action: >
      [[[ const r = ((entity && entity.attributes.items) || [])[variables.index];
          return r ? 'perform-action' : 'none'; ]]]
    perform_action: '[[[ return variables.delete_action; ]]]'
    data:
      id: >
        [[[ const r = ((entity && entity.attributes.items) || [])[variables.index]; return r ? String(r.id) : ''; ]]]
    confirmation:
      text: >
        [[[ const r = ((entity && entity.attributes.items) || [])[variables.index];
            return r ? `Delete the reminder “${r.text}”?` : ''; ]]]
  styles:
    card:
      - display: >
          [[[ const l = (entity && entity.attributes.items) || [];
              return l[variables.index] || (variables.index === 0 && l.length === 0) ? 'block' : 'none'; ]]]
      - background: var(--kit-surface-strong, rgba(255, 255, 255, 0.10))
      - border: 1px solid var(--kit-stroke, rgba(255, 255, 255, 0.24))
      - border-radius: 16px
      - box-shadow: none
      - padding: 10px 12px
      - color: var(--kit-text, rgba(255, 255, 255, 0.95))
      - font-family: var(--kit-font, -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Segoe UI', Roboto, system-ui, sans-serif)
    grid:
      - grid-template-areas: '"i t x" "i m x"'
      - grid-template-columns: 30px 1fr 30px
      - grid-template-rows: 1fr auto
      - column-gap: 10px
    custom_fields:
      i:
        - align-self: center
        - width: 26px
        - color: 'var(--kit-accent, #0a84ff)'
      t:
        - justify-self: start
        - text-align: left
        - font-size: 14px
        - font-weight: 600
        - line-height: 1.25
        - display: -webkit-box
        - '-webkit-line-clamp': '2'
        - '-webkit-box-orient': vertical
        - overflow: hidden
      m:
        - justify-self: start
        - text-align: left
        - font-size: 12px
        - color: var(--kit-text-dim, rgba(255, 255, 255, 0.68))
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%
      x:
        - align-self: center
        - width: 22px
        - color: var(--kit-text-dim, rgba(255, 255, 255, 0.68))
  custom_fields:
    i: >
      [[[ const r = ((entity && entity.attributes.items) || [])[variables.index];
          const icon = !r ? 'mdi:bell-off-outline' : (r.repeat && r.repeat !== 'once' ? 'mdi:bell-ring-outline' : 'mdi:bell-outline');
          return `<ha-icon icon="${icon}" style="width:100%"></ha-icon>`; ]]]
    t: >
      [[[ const esc = s => String(s).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
          const r = ((entity && entity.attributes.items) || [])[variables.index];
          return r ? esc(r.text) : esc(variables.empty_text); ]]]
    m: >
      [[[ const esc = s => String(s).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
          const r = ((entity && entity.attributes.items) || [])[variables.index];
          if (!r) return '';
          const tz = hass.config.time_zone, lang = (hass.locale && hass.locale.language) || 'en';
          const d = new Date(r.next);
          const day = x => x.toLocaleDateString('en-CA', {timeZone: tz});
          const now = new Date(), tom = new Date(now.getTime() + 86400000);
          const time = d.toLocaleTimeString(lang, {timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false});
          const when = day(d) === day(now) ? 'Today' : day(d) === day(tom) ? 'Tomorrow'
            : d.toLocaleDateString(lang, {timeZone: tz, weekday: 'short', day: 'numeric', month: 'short'});
          const rep = {once: 'Once', daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly', yearly: 'Yearly'}[r.repeat] || r.repeat;
          return esc([when + ' ' + time, rep, r.speaker].filter(x => x).join(' · ')); ]]]
    x: >
      [[[ const r = ((entity && entity.attributes.items) || [])[variables.index];
          return r ? '<ha-icon icon="mdi:trash-can-outline" style="width:100%"></ha-icon>' : ''; ]]]
