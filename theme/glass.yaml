# Glass theme for the kit. Copy to /config/themes/glass.yaml (needs `frontend: themes: !include_dir_merge_named themes` in configuration.yaml).
# Every kit-* variable becomes a CSS variable --kit-* that the templates read. Change the look here, never inside a template.
glass:
  modes:
    dark:
      # ---- kit tokens ----
      kit-bg: "radial-gradient(ellipse 130% 70% at 50% -8%, rgba(0, 0, 0, 0) 56%, rgba(170, 195, 255, 0.40) 58.5%, rgba(120, 150, 255, 0.10) 61%, rgba(0, 0, 0, 0) 64%), radial-gradient(ellipse 80% 45% at 50% 0%, rgba(120, 150, 255, 0.45) 0%, rgba(120, 150, 255, 0) 70%), radial-gradient(ellipse 65% 75% at 108% 108%, rgba(60, 210, 170, 0.75) 0%, rgba(60, 210, 170, 0) 62%), radial-gradient(ellipse 55% 55% at -8% 105%, rgba(10, 20, 80, 0.85) 0%, rgba(10, 20, 80, 0) 70%), linear-gradient(165deg, #06104a 0%, #1434b0 40%, #1a3fc4 55%, #0c2380 80%, #071450 100%) fixed"
      kit-surface: "linear-gradient(145deg, rgba(255, 255, 255, 0.17) 0%, rgba(255, 255, 255, 0.05) 100%)"
      kit-surface-strong: "rgba(255, 255, 255, 0.10)"
      kit-stroke: "rgba(255, 255, 255, 0.24)"
      kit-blur: "blur(28px) saturate(115%)"
      kit-radius: "28px"
      kit-radius-small: "14px"
      kit-pad: "14px"
      kit-gap: "8px"
      kit-text: "rgba(255, 255, 255, 0.95)"
      kit-text-dim: "rgba(255, 255, 255, 0.68)"
      kit-accent: "#0a84ff"
      kit-heat: "#ff9f0a"
      kit-cool: "#64d2ff"
      kit-ok: "#30d158"
      kit-alert: "#ff453a"
      kit-shadow: "inset 0 1px 0 rgba(255, 255, 255, 0.40), inset 0 -1px 0 rgba(255, 255, 255, 0.06), 0 12px 32px rgba(3, 10, 45, 0.35)"
      kit-button-stroke: "rgba(255, 255, 255, 0.75)"
      kit-sun: "#ffd60a"
      kit-bottom-space: "110px"
      kit-off: "rgba(255, 255, 255, 0.55)"
      kit-font: "-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Segoe UI', Roboto, system-ui, sans-serif"
      kit-size-value: "34px"
      kit-size-name: "15px"
      kit-size-label: "12px"
      # ---- Home Assistant variables, so core cards match ----
      lovelace-background: "var(--kit-bg)"
      primary-background-color: "#071450"
      secondary-background-color: "#0c2380"
      card-background-color: "#0c2380"
      ha-card-background: "var(--kit-surface)"
      ha-card-border-radius: "var(--kit-radius)"
      ha-card-border-color: "var(--kit-stroke)"
      ha-card-box-shadow: "none"
      primary-text-color: "var(--kit-text)"
      secondary-text-color: "var(--kit-text-dim)"
      primary-color: "var(--kit-accent)"
      accent-color: "var(--kit-heat)"
      state-climate-heat-color: "var(--kit-heat)"
      paper-font-common-base_-_font-family: "var(--kit-font)"
      ha-font-family-body: "var(--kit-font)"
      # top bar, sidebar, bubble-card pop-ups and footer pills
      app-header-background-color: "#081a6a"
      app-header-text-color: "var(--kit-text)"
      sidebar-background-color: "#06104a"
      # icons: HA keeps light-mode icon tokens unless the theme overrides them (navy icons on navy)
      rgb-primary-text-color: "255, 255, 255"
      rgb-secondary-text-color: "255, 255, 255"
      sidebar-icon-color: "rgba(255, 255, 255, 0.72)"
      sidebar-selected-background-color: "rgba(255, 255, 255, 0.10)"
      state-icon-color: "rgba(255, 255, 255, 0.88)"
      paper-item-icon-color: "rgba(255, 255, 255, 0.88)"
      state-inactive-color: "rgba(255, 255, 255, 0.55)"
      disabled-text-color: "rgba(255, 255, 255, 0.40)"
      blue-color: "#64d2ff"
      light-blue-color: "#64d2ff"
      info-color: "#64d2ff"
      indigo-color: "#a5b4ff"
      grey-color: "rgba(255, 255, 255, 0.70)"
      blue-grey-color: "rgba(255, 255, 255, 0.70)"
      dark-grey-color: "rgba(255, 255, 255, 0.55)"
      bubble-pop-up-background-color: "rgba(16, 40, 140, 0.72)"
      bubble-main-background-color: "rgba(255, 255, 255, 0.12)"
      bubble-secondary-background-color: "rgba(255, 255, 255, 0.10)"
    light:
      kit-bg: "radial-gradient(120% 120% at 0% 0%, #dfe8f7 0%, #eef1f6 55%, #f7f8fa 100%) fixed"
      kit-surface: "rgba(255, 255, 255, 0.55)"
      kit-surface-strong: "rgba(255, 255, 255, 0.85)"
      kit-stroke: "rgba(0, 0, 0, 0.08)"
      kit-blur: "blur(24px) saturate(160%)"
      kit-radius: "24px"
      kit-radius-small: "14px"
      kit-pad: "14px"
      kit-gap: "8px"
      kit-text: "rgba(0, 0, 0, 0.88)"
      kit-text-dim: "rgba(0, 0, 0, 0.55)"
      kit-accent: "#007aff"
      kit-heat: "#ff9500"
      kit-cool: "#32ade6"
      kit-ok: "#34c759"
      kit-alert: "#ff3b30"
      kit-shadow: "inset 0 1px 0 rgba(255, 255, 255, 0.70), 0 8px 24px rgba(0, 0, 0, 0.08)"
      kit-button-stroke: "rgba(0, 0, 0, 0.35)"
      kit-sun: "#ff9f0a"
      kit-bottom-space: "110px"
      kit-off: "rgba(0, 0, 0, 0.30)"
      kit-font: "-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Segoe UI', Roboto, system-ui, sans-serif"
      kit-size-value: "34px"
      kit-size-name: "15px"
      kit-size-label: "12px"
      lovelace-background: "var(--kit-bg)"
      primary-background-color: "#f7f8fa"
      secondary-background-color: "#eef1f6"
      card-background-color: "#ffffff"
      ha-card-background: "var(--kit-surface)"
      ha-card-border-radius: "var(--kit-radius)"
      ha-card-border-color: "var(--kit-stroke)"
      ha-card-box-shadow: "none"
      primary-text-color: "var(--kit-text)"
      secondary-text-color: "var(--kit-text-dim)"
      primary-color: "var(--kit-accent)"
      accent-color: "var(--kit-heat)"
      state-climate-heat-color: "var(--kit-heat)"
      paper-font-common-base_-_font-family: "var(--kit-font)"
      ha-font-family-body: "var(--kit-font)"
      app-header-background-color: "#eef1f6"
      app-header-text-color: "var(--kit-text)"
      sidebar-background-color: "#e6eaf2"
      # icons: neutral iOS greys instead of HA's slate blue, iOS blue for "blue" icons
      sidebar-icon-color: "rgba(0, 0, 0, 0.55)"
      sidebar-selected-background-color: "rgba(0, 122, 255, 0.10)"
      state-icon-color: "rgba(0, 0, 0, 0.62)"
      paper-item-icon-color: "rgba(0, 0, 0, 0.62)"
      state-inactive-color: "rgba(0, 0, 0, 0.35)"
      blue-color: "#007aff"
      light-blue-color: "#32ade6"
      info-color: "#007aff"
      indigo-color: "#5856d6"
      grey-color: "rgba(0, 0, 0, 0.45)"
      blue-grey-color: "rgba(0, 0, 0, 0.50)"
      bubble-pop-up-background-color: "rgba(247, 248, 250, 0.80)"
      bubble-main-background-color: "rgba(255, 255, 255, 0.70)"
      bubble-secondary-background-color: "rgba(0, 0, 0, 0.05)"
